server {
    listen       80;
    server_name  localhost;

    # 前端静态文件根目录
    root   /usr/share/nginx/html;

    # 所有HTML请求都返回index.html（解决Vue路由的404问题）
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API请求反向代理到后端（腾讯云云托管内网调用）
    # 前端请求 /api/xxx → 代理到后端服务内网地址
    location ^~ /api/ {
        # 使用变量方式，避免 Nginx 启动时解析失败导致退出
        # DNS_RESOLVER 将由 entrypoint.sh 从 /etc/resolv.conf 动态替换
        resolver DNS_RESOLVER valid=30s;
        set $backend_host "djglhdol.jc-ai-agent-backend.0xp5x12a.6j12dd4n.com:8123";
        proxy_pass http://$backend_host;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events)配置
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;

        proxy_intercept_errors off;
    }

    # 处理静态资源请求
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # 处理错误页
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
