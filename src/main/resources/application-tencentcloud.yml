spring:
  datasource:
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:jc_ai_agent}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:}
    postgres:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:jc_ai_agent}
      username: ${PG_USERNAME:postgres}
      password: ${PG_PASSWORD:}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:qwen-max} #可选 qwen-plus
          max-tokens: 8000
      embedding:
        options:
          model: qwen3.7-text-embedding #可选 text-embedding-v4 text-embedding-v3
    mcp:
      client:
        enabled: false
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
weather:
  api:
    key: ${WEATHER_API_KEY:}
    url: https://restapi.amap.com/v3/weather/weatherInfo
    ip:
      url: https://restapi.amap.com/v3/ip
    geo:
      url: https://restapi.amap.com/v3/geocode/geo
search-api:
  api-key: ${SEARCH_API_KEY:}
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.jc.aiagent.controller
# knife4j interface setting
knife4j:
  enable: true
  setting:
    language: zh_cn
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jc.aiagent.entity
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.alibaba.cloud.ai.dashscope: DEBUG
    org.springframework.ai: DEBUG