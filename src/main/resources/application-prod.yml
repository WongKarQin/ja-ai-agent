spring:
  application:
    name: AIagent
  profiles:
    active: local
#  ai:
#    mcp:
#      client:
#        sse:
#          connections:
#            image-search-mcp-server:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.jc.aiagent.controller
# knife4j interface setting
knife4j:
  enable: true
  setting:
    language: zh_cn
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jc.aiagent.entity
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.alibaba.cloud.ai.dashscope: DEBUG
    org.springframework.ai: DEBUG